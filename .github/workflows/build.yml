name: Build and Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Detect build-related changes
      id: filter
      uses: dorny/paths-filter@v3
      with:
        filters: |
          relevant:
            - 'Sources/**'
            - 'Tests/**'
            - 'Fluid.xcodeproj/**'
            - 'Package.swift'
            - 'Package.resolved'
            - 'Info.plist'
            - 'Fluid.entitlements'
            - '.swiftlint.yml'
            - '.github/workflows/build.yml'

  lint:
    name: SwiftLint
    if: needs.changes.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.draft == false)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run SwiftLint (strict)
      run: |
        docker run --rm \
          --volume "$PWD:$PWD" \
          --workdir "$PWD" \
          ghcr.io/realm/swiftlint:0.63.2 \
          lint --strict --config .swiftlint.yml

  build:
    name: Build FluidVoice
    if: needs.changes.outputs.relevant == 'true' && needs.lint.result == 'success'
    needs: [changes, lint]
    runs-on: macos-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install xcpretty
      run: sudo gem install xcpretty

    - name: Cache Whisper models
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/WhisperModels
        key: ${{ runner.os }}-whisper-models-transcribecpp-v1

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Run shared CI checks
      env:
        CI_RESULT_DIR: build/test-results
      run: bash Tests/run_ci_checks.sh

    - name: Collect crash reports
      if: always()
      run: |
        mkdir -p build/test-results/crashes
        find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -name 'FluidVoice*' -exec cp {} build/test-results/crashes/ \; 2>/dev/null || true

    - name: Save test diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-test-results
        path: build/test-results
        if-no-files-found: ignore
        retention-days: 7
